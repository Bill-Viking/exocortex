  <path d="M468 164 H700" fill="none" stroke="#1d1d1b" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" />
  <text x="60" y="251" fill="#1d1d1b" font-family="&quot;Apple Garamond&quot;, Garamond, &quot;EB Garamond&quot;, &quot;Hoefler Text&quot;, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">02</text>
  <text x="60" y="280" fill="#1d1d1b" font-family="&quot;Apple Garamond&quot;, Garamond, &quot;EB Garamond&quot;, &quot;Hoefler Text&quot;, Georgia, serif" font-size="20" font-weight="400" text-anchor="start">Pull the brain</text>
