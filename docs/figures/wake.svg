<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">The wake sequence</title>
  <desc id="desc">Check the real clock, pull the brain, and ask whether the project’s writing claim is free. Yes: take the claim and stamp in. No: read only, consult, report by mail. Both routes lead to reading STATUS.md, the opener and mail, then taking up recorded work and closing with STATUS, the next opener and release of the claim. The eight directed connections are retained.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#1d1d1b" />
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#ffb000" />
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#ffffff" />
