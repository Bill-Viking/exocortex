  <text x="600" y="880" fill="#c4262e" font-family="&quot;Apple Garamond&quot;, Garamond, &quot;EB Garamond&quot;, &quot;Hoefler Text&quot;, Georgia, serif" font-size="23" font-weight="400" text-anchor="middle">Every session</text>
  <text x="1140" y="880" fill="#1d1d1b" font-family="&quot;Apple Garamond&quot;, Garamond, &quot;EB Garamond&quot;, &quot;Hoefler Text&quot;, Georgia, serif" font-size="18" font-weight="400" text-anchor="end">2</text>
  <text x="60" y="171" fill="#1d1d1b" font-family="&quot;Apple Garamond&quot;, Garamond, &quot;EB Garamond&quot;, &quot;Hoefler Text&quot;, Georgia, serif" font-size="20" font-weight="700" text-anchor="start">01</text>
