  <text x="60" y="600" fill="#1d1d1b" font-family="&quot;Apple Garamond&quot;, Garamond, &quot;EB Garamond&quot;, &quot;Hoefler Text&quot;, Georgia, serif" font-size="20" font-weight="400" text-anchor="start">Read STATUS.md, the opener, the mail</text>
